<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация персонажа - Кот-Воитель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-container">
        <h1>Рождение: Регистрация</h1>
        
        <form id="registerForm">
            <!-- Имя кота -->
            <label for="catName">Имя кота:</label>
            <input type="text" id="catName" placeholder="Например: Крутобок" required>

            <!-- Выбор племени -->
            <label for="tribeSelect">Племя:</label>
            <select id="tribeSelect">
                <option value="thunder">Одиночки</option>
            </select>

            <!-- Кнопка создания -->
            <button type="submit" class="btn-create">Зарегестрировать</button>
        </form>
    </div>

    <!-- Кнопка возврата в главное меню -->
        <a href="index.html" class="btn-back">← Назад в главное меню</a>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
