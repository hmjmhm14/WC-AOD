<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в игру - Кот-Воитель</title>
</head>
<body style="
    background-image: url('https://images.unsplash.com/photo-1543510875-8b2e1c93c1ed?q=80&w=1170&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #f0f0f0; 
    font-family: sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0;
">

    <!-- Карточка входа -->
    <div style="
        background-color: rgba(42, 42, 42, 0.75); 
        border: 1px solid rgba(255, 255, 255, 0.15); 
        border-radius: 12px; 
        padding: 30px; 
        box-sizing: border-box; 
        width: 340px; 
        backdrop-filter: blur(4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    ">
        
        <!-- Кнопка назад -->
        <a href="index.html" style="
            color: #aaa; 
            text-decoration: none; 
            font-size: 13px; 
            display: inline-block; 
            margin-bottom: 15px;
        ">← Назад в меню</a>

        <h1 style="font-size: 20px; text-align: center; margin: 0 0 20px 0; color: #ffffff;">Вход в аккаунт</h1>
        
        <form id="loginForm">
            <!-- Логин или Email -->
            <label style="display: block; margin-top: 10px; font-size: 14px; color: #ddd;">Логин или Email:</label>
            <input type="text" id="loginUser" placeholder="Ваш логин или почта" required style="
                width: 100%; padding: 10px; margin-top: 6px; 
                background-color: rgba(24, 24, 24, 0.8); 
                border: 1px solid rgba(255, 255, 255, 0.2); 
                color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;
            ">

            <!-- Пароль -->
            <label style="display: block; margin-top: 15px; font-size: 14px; color: #ddd;">Пароль:</label>
            <input type="password" id="loginPassword" placeholder="Введите пароль" required style="
                width: 100%; padding: 10px; margin-top: 6px; 
                background-color: rgba(24, 24, 24, 0.8); 
                border: 1px solid rgba(255, 255, 255, 0.2); 
                color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;
            ">

            <!-- Кнопка входа -->
            <button type="submit" style="
                width: 100%; margin-top: 25px; padding: 12px; 
                background-color: #2196F3; color: white; border: none; 
                border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; box-sizing: border-box;
            ">Войти</button>
        </form>
    </div>

</body>
</html>
